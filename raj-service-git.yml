name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:      
      - '/raj-service-git.yml'

jobs:
  build-and-deploy:
    name: Build JAR and Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: cd backend && ./mvnw test
        # Tests run against H2 in-memory DB (no PostgreSQL needed in CI)

      - name: Build production JAR
        run: ./mvnw clean package -DskipTests
        # Skips tests here — they already ran above

      - name: Deploy JAR to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # First copy the JAR, then do the atomic swap + restart
          script: |
            set -e
            # Upload new JAR to a staging location
            echo "Deployment starting..."

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/jewellers-0.0.1-SNAPSHOT.jar"
          target: "/tmp/"
          strip_components: 2

      - name: Swap JAR and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Atomic swap — keep old JAR as backup
            sudo cp /opt/todoapp/todo-api.jar /opt/todoapp/todo-api.jar.bak 2>/dev/null || true
            sudo cp /tmp/todo-api-0.0.1-SNAPSHOT.jar /opt/todoapp/todo-api.jar
            sudo chown todoapp:todoapp /opt/todoapp/todo-api.jar

            # Graceful restart via systemd
            sudo systemctl restart todoapp

            # Wait for Spring Boot to start (JVM warm-up ~25-35s on t2.micro)
            echo "Waiting for Spring Boot to start..."
            for i in $(seq 1 18); do
              sleep 5
              STATUS=$(curl -sf http://localhost:8080/actuator/health | grep -o '"status":"UP"' || true)
              if [ -n "$STATUS" ]; then
                echo "Application is UP after $((i*5))s"
                exit 0
              fi
              echo "Attempt $i: not ready yet..."
            done

            # If still not up after 90 seconds, roll back
            echo "Startup timed out — rolling back to previous JAR"
            sudo cp /opt/todoapp/todo-api.jar.bak /opt/todoapp/todo-api.jar
            sudo chown todoapp:todoapp /opt/todoapp/todo-api.jar
            sudo systemctl restart todoapp
            exit 1